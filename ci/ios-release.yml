name: Build PickBank iOS Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Test Core & Build Universal iOS IPA (Xcode 26 / iOS 26 SDK)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode toolchain
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Run PickBankCore unit tests
        run: |
          cd Packages/PickBankCore
          swift test

      - name: Install XcodeGen & generate PickBank.xcodeproj
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build Universal iOS App (iPhone + iPad, Release, Unsigned)
        run: |
          xcodebuild build \
            -project PickBank.xcodeproj \
            -scheme PickBank \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify iOS Simulator build
        run: |
          xcodebuild build \
            -project PickBank.xcodeproj \
            -scheme PickBank \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/SimDerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA & Generate Checksums
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" | head -n 1)
          echo "Packaged app: $APP_PATH"
          test -d "$APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -qry PickBank-iOS.ipa Payload
          rm -rf Payload
          shasum -a 256 PickBank-iOS.ipa > SHA256SUMS.txt
          ls -lh PickBank-iOS.ipa
          cat SHA256SUMS.txt

      - name: Upload PickBank-iOS.ipa workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PickBank-iOS-v2.0.0
          path: |
            dist/PickBank-iOS.ipa
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release v2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/PickBank-iOS.ipa dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/PickBank-iOS.ipa dist/SHA256SUMS.txt \
              --title "PickBank iOS v2.0.0 (Liquid Glass Universal)" \
              --notes "Universal unsigned iPhone + iPad IPA built with Xcode 26 / iOS 26 SDK. Ready for $0 SideStore / AltStore / Sideloadly sideloading."
          fi
