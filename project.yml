name: PickBank
options:
  bundleIdPrefix: com.smartlotus
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  PickBankCore:
    path: Packages/PickBankCore

settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false

targets:
  PickBank:
    type: application
    platform: iOS
    sources:
      - path: PickBankApp
        excludes:
          - "Info.plist"
          - "PickBank.entitlements"
          - "Resources/PetAssets"
          - "Resources/Assets.xcassets"
      - path: PickBankApp/Resources/Assets.xcassets
      - path: PickBankApp/Resources/PetAssets
        type: folder
        buildPhase: resources
    dependencies:
      - package: PickBankCore
        product: PickBankCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartlotus.pickbank
        PRODUCT_NAME: PickBank
        INFOPLIST_FILE: PickBankApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: PickBankApp/PickBank.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
